name: ai_medicine_tracker
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  shared_preferences: ^2.5.5
  dio: ^5.10.0
  webview_flutter: ^4.14.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  cloud_functions: ^6.3.5
  firebase_app_check: ^0.4.5+2
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_smart_dialog: ^5.1.1
  url_launcher: ^6.3.2
  share_plus: ^13.2.1
  package_info_plus: ^10.2.1
  in_app_review: ^2.0.12
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  in_app_purchase: ^3.3.0
  in_app_purchase_android: any
  firebase_remote_config: ^6.5.5
  google_mobile_ads: ^9.0.0
  image_picker: ^1.2.3
  in_app_update: ^5.0.0
  pdf: ^3.13.0
  printing: ^5.15.0
  app_settings: ^8.0.3
  device_info_plus: ^13.2.0

  webview_flutter_android: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/svg/
